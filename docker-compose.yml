services:
  backend:
    container_name: kupipodariday-backend
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "4000:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: always
    networks:
      - kupipodariday

  frontend:
    container_name: kupipodariday-frontend
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always
    networks:
      - kupipodariday

  database:
    container_name: kupipodariday-database
    build:
      context: ./database
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - kupipodariday

volumes:
  postgres-data:

networks:
  kupipodariday:
    driver: bridge
